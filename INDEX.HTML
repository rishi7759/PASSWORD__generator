<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password_generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

     <h1> PASSWORD GENERATOR  </h1>

     <div class="display-container">

        <input readonly placeholder="pasword" class="display" data-passwordDisplay>

        <button class="copyBtn" data-copy>
            <span data-copyMsg>
                <!-- copied -->
            </span>
            <img src="copy.webp" alt="copy" width="23" height="23" >
        </button>

     </div>

     <div class="input-container">

       <div class="length-container">
        <p>password length </p>
        <p  data-lengthNumber> 0 </p>
       </div>

       <!-- slider -->

       <input type="range" min="1" max="20" class="slider" step="1" data-lengthSlider>


       <!--  check box -->

       <div class="check">
           <input type="checkbox" id="uppercase">
           <label for="uppercase"> Includes Uppercase letters  </label>

       </div>

       
       <div class="check">
           <input type="checkbox" id="lowercase">
           <label for="uppercase"> Includes lowercase letters  </label>

       </div>

       
       <div class="check">
           <input type="checkbox" id="numbers">
           <label for="uppercase"> Includes numbers  </label>

       </div>

       
       <div class="check">
           <input type="checkbox" id="symbols">
           <label for="uppercase"> Includes symbols  </label>

       </div>

       <!-- strength section -->

       <div class="strength-container">

        <p>Strength</p>
        <div data-indicator="" class="indicator"></div>
       </div>


       <!-- genetrate password button -->

        <button class="generateBtn"> Generate password</button>

     </div>



    </div>
    



    <script src="index.js"></script>
</body>
</html>
